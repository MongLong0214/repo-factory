# project-ci — the check the control plane consumes by exact head.
#
# Two toolchains, because a test set that silently shrinks on one of them is a zero-test lane
# wearing a green tick. The lower bound is the project's MSRV; latest is stable.
name: project-ci
on:
  pull_request:
  merge_group:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    name: project-ci
    strategy:
      fail-fast: false
      matrix:
        runtime: ["{{RUNTIME_LOWER}}", "{{RUNTIME_LATEST}}"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.runtime }}
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
      - name: install dependencies
        run: {{INSTALL_CMD}}
      - name: test
        run: {{TEST_CMD}}
      - name: build
        run: {{BUILD_CMD}}
