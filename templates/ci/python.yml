# project-ci — the check the control plane consumes by exact head.
#
# Two runtimes, because a test set that silently shrinks on one of them is a zero-test lane
# wearing a green tick. The lower bound is the version the project claims to support; latest
# is what a contributor will actually have installed.
name: project-ci
on:
  pull_request:
  merge_group:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    name: project-ci
    strategy:
      fail-fast: false
      matrix:
        runtime: ["{{RUNTIME_LOWER}}", "{{RUNTIME_LATEST}}"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.runtime }}
          cache: "pip"
      - name: install dependencies
        run: {{INSTALL_CMD}}
      - name: test
        run: {{TEST_CMD}}
      - name: build
        run: {{BUILD_CMD}}
