# repo-factory's own CI.
#
# The contract tests are the reason this exists. They run the control plane's real validators —
# `assertPortableManifest` and `parseRepoFactoryResult` — against the commit pinned in
# governance/acp-contract.lock.json. A contract check whose other side floats is a report about
# whatever happened to be checked out, so the pin is cloned rather than assumed, and an absent
# control plane fails the job instead of skipping the checks.
name: project-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    name: project-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: install python dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: read the pinned control-plane commit
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("governance/acp-contract.lock.json"))
          print(f"repository={lock['repository']}")
          print(f"commit={lock['commit']}")
          PY

      - name: clone the control plane at that exact commit
        run: |
          git init --quiet acp
          git -C acp remote add origin "${{ steps.pin.outputs.repository }}"
          git -C acp fetch --quiet --depth 1 origin "${{ steps.pin.outputs.commit }}"
          git -C acp checkout --quiet FETCH_HEAD
          test "$(git -C acp rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: install the control plane's dependencies
        working-directory: acp
        run: pnpm install --frozen-lockfile

      # RF_ALLOW_CONTRACT_SKIP is deliberately not set. A skipped contract check and a passing
      # one are the same line in a summary, and that is how a release suite goes green having
      # verified nothing about the side it integrates with.
      - name: test
        env:
          ACP_SRC: ${{ github.workspace }}/acp/src
        run: python -m pytest tests/ -q
