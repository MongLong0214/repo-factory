name: CommitLore squash inheritance

# A squash merge replaces a branch's commits with one that does not carry their trailers, and
# GitHub performs that merge on its own servers, where no local hook runs. The **Squash and merge**
# button is enabled on this repository, so a press of it drops the branch's records silently while
# showing the author a green merge. `commitlore doctor` reports the loss only afterwards, once the
# record is already gone. This action is the only thing that has what it needs at that moment: the
# pull request, its commits, and the commit they were squashed into.
#
# Every merged pull request here so far has gone through that button. Added 2026-09-15, after
# `commitlore doctor` named it as protection that was simply not switched on.
#
# `pull_request_target`, not `pull_request`: a pull request from a fork gets a read-only token on
# `pull_request`, so the job would build the record and then fail to publish it.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write # the one push to refs/notes/commitlore

concurrency:
  group: commitlore-notes
  cancel-in-progress: false

jobs:
  preserve:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # the merge commit is on the base branch, and a closed pull request has no merge ref
          # left to check out
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      # the mirror this action writes; publishing from a checkout that never read it would fork
      # the notes history
      - run: git fetch --no-tags origin '+refs/notes/commitlore:refs/notes/commitlore' || true

      # a squash merge usually deletes the branch, and then the pull request's own ref is the only
      # one still reaching the commits that carry records
      - run: git fetch --no-tags --force origin
          '+refs/pull/${{ github.event.pull_request.number }}/head:refs/commitlore/pr-head'

      # The action runs CommitLore from a checkout of that repository: the package is private, so
      # there is no published npm name to fall back to. `dist/` is committed, so nothing builds --
      # but committed `dist/` removes the *build* step, not the *install* step. `dist/cli.js` opens
      # with `import { Command } from 'commander'`, a bare specifier, so without `node_modules` it
      # dies in ESM resolution before parsing anything.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MongLong0214/commitlore
          ref: v1.4.0
          path: .commitlore-cli
          persist-credentials: false

      # `--omit=dev` because only the runtime imports are needed, and `--ignore-scripts` because
      # this installs a third-party lockfile into a job holding a token with `contents: write`.
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .commitlore-cli

      # The install is only useful if the CLI actually starts. One version call, before the action,
      # so a resolution failure is reported as one rather than as "cannot parse the merge message".
      - run: node dist/cli.js --version
        working-directory: .commitlore-cli

      - uses: MongLong0214/commitlore/action/preserve@v1.4.0
        with:
          cli-path: .commitlore-cli/dist/cli.js

# 2026-09-15, measured after this file was first written: `dist/cli.js` (12,331 bytes,
# sha 0990ab9be53e) and `action/preserve/preserve.mjs` (30,242 bytes, sha 384c6e9bd589) are
# byte-identical at v1.2.16 and v1.4.0. The pin here is v1.4.0 and agent-control-plane's is
# v1.2.16, and those two pins run the same bytes. A future bump should be justified by a measured
# difference in these two files, not by the release number.
